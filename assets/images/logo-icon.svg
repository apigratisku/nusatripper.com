<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02C39A"/>
      <stop offset="50%" stop-color="#00A896"/>
      <stop offset="100%" stop-color="#0A2540"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#F4B41A"/>
    </linearGradient>
    <linearGradient id="needleLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="needleShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0A2540" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle rounded badge -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Outer Compass Ring -->
  <circle cx="64" cy="64" r="46" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>
  <circle cx="64" cy="64" r="40" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.2" stroke-dasharray="2 4"/>

  <!-- Cardinal Compass Ticks -->
  <line x1="64" y1="14" x2="64" y2="21" stroke="#FFE066" stroke-width="3" stroke-linecap="round"/>
  <line x1="114" y1="64" x2="107" y2="64" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round"/>
  <line x1="64" y1="114" x2="64" y2="107" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round"/>
  <line x1="14" y1="64" x2="21" y2="64" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round"/>

  <!-- Ocean Waves at Bottom -->
  <path d="M22 78 C34 70, 46 84, 60 76 C74 68, 88 82, 106 72" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M26 88 C38 82, 50 92, 64 86 C78 80, 92 90, 102 84" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="3" stroke-linecap="round"/>

  <!-- Compass Needle (North-East adventure angle 45 deg) -->
  <g transform="rotate(45 64 64)">
    <!-- North Pointer (Gold) -->
    <polygon points="64,22 56,64 64,64" fill="url(#goldGrad)"/>
    <polygon points="64,22 72,64 64,64" fill="#D99B0D"/>

    <!-- South Pointer (Silver/White) -->
    <polygon points="64,106 56,64 64,64" fill="url(#needleShadow)"/>
    <polygon points="64,106 72,64 64,64" fill="url(#needleLight)"/>

    <!-- Center Pivot Core -->
    <circle cx="64" cy="64" r="8" fill="#FFFFFF" filter="url(#shadow)"/>
    <circle cx="64" cy="64" r="4.5" fill="#0A2540"/>
    <circle cx="64" cy="64" r="1.8" fill="#FFE066"/>
  </g>

  <!-- Sparkle / Star of adventure -->
  <path d="M64 22 L65.5 27 L70.5 28.5 L65.5 30 L64 35 L62.5 30 L57.5 28.5 L62.5 27 Z" fill="#FFE066"/>
</svg>