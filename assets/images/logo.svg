<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64">
  <defs>
    <linearGradient id="logoIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02C39A"/>
      <stop offset="50%" stop-color="#00A896"/>
      <stop offset="100%" stop-color="#0A2540"/>
    </linearGradient>
    <linearGradient id="goldNeedle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#F4B41A"/>
    </linearGradient>
  </defs>

  <!-- Icon Mark (48x48) -->
  <g transform="translate(6, 8)">
    <rect width="48" height="48" rx="14" fill="url(#logoIconGrad)"/>
    <circle cx="24" cy="24" r="18" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.2"/>
    <line x1="24" y1="3.5" x2="24" y2="7.5" stroke="#FFE066" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Waves -->
    <path d="M9 34 C14 31, 19 37, 24 33 C29 29, 34 35, 39 31" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Needle rotated 45 deg -->
    <g transform="rotate(45 24 24)">
      <polygon points="24,7 20.5,24 24,24" fill="url(#goldNeedle)"/>
      <polygon points="24,7 27.5,24 24,24" fill="#D99B0D"/>
      <polygon points="24,41 20.5,24 24,24" fill="#94A3B8"/>
      <polygon points="24,41 27.5,24 24,24" fill="#FFFFFF"/>
      <circle cx="24" cy="24" r="3.5" fill="#FFFFFF"/>
      <circle cx="24" cy="24" r="1.6" fill="#0A2540"/>
    </g>
  </g>

  <!-- Typography -->
  <g transform="translate(66, 12)">
    <!-- Primary Title -->
    <text x="0" y="24" font-family="'Plus Jakarta Sans', 'Montserrat', -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="0.5" fill="#0A2540">NUSA<tspan fill="#00A896">TRIPPER</tspan><tspan fill="#F4B41A" font-size="16">.COM</tspan></text>
    <!-- Tagline Subtitle -->
    <text x="1" y="39" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="8.5" font-weight="700" letter-spacing="2.2" fill="#00A896" text-transform="uppercase">LOMBOK TOUR &amp; EXPEDITION</text>
  </g>
</svg>