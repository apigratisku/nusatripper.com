; Batas upload untuk panel admin nusatripper.com.
; Video galeri bisa sampai 200 MB, jadi upload_max_filesize & post_max_size
; harus lebih besar dari batas tersebut (disertakan overhead multipart).
upload_max_filesize = 220M
post_max_size = 230M
max_file_uploads = 20
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
