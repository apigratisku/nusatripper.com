<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="robots" content="noindex, nofollow">
	<title>Masuk &middot; Admin NUSATRIPPER.COM</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
	<link rel="stylesheet" href="http://127.0.0.1:8899/assets/css/admin.css?v=1793076998">
	<meta name="theme-color" content="#0A2540">
	<link rel="icon" type="image/svg+xml" href="http://127.0.0.1:8899/assets/images/favicon.svg">
	<link rel="icon" type="image/png" sizes="32x32" href="http://127.0.0.1:8899/assets/images/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="http://127.0.0.1:8899/assets/images/favicon-16x16.png">
	<link rel="apple-touch-icon" sizes="180x180" href="http://127.0.0.1:8899/assets/images/apple-touch-icon.png">
</head>
<body class="auth-body">

<div class="auth-shell">
	<div class="auth-card">
		<div class="auth-brand">
			<img src="http://127.0.0.1:8899/assets/images/logo-icon.svg" alt="Logo" class="auth-logo" width="46" height="46">
			<div>
				<strong>NUSATRIPPER.COM</strong>
				<small>Panel Administrator</small>
			</div>
		</div>

		<h1 class="auth-title">Masuk ke Panel</h1>
		<p class="auth-subtitle">Kelola paket wisata, galeri, dan konten landing page.</p>

					<div class="alert alert-error">Username atau password salah.</div>
		
		<form action="http://127.0.0.1:8899/admin/login" class="form-stack" autocomplete="on" method="post" accept-charset="utf-8">
<input type="hidden" name="csrf_token" value="d96363160be39bc18d17156ee0fc61c9" />                                                                   

			<label class="field">
				<span class="field-label">Username</span>
				<input
					type="text"
					class="input"
					name="username"
					value="admin"
					placeholder="admin"
					autocomplete="username"
					autocapitalize="none"
					spellcheck="false"
					required
					autofocus
				>
			</label>

			<label class="field">
				<span class="field-label">Password</span>
				<input
					type="password"
					class="input"
					name="password"
					placeholder="••••••••"
					autocomplete="current-password"
					required
				>
			</label>

			<button type="submit" class="btn btn-primary btn-lg btn-block">
				<i class="fa-solid fa-right-to-bracket"></i> Masuk
			</button>

		</form>
		<p class="auth-note">
			<a href="http://127.0.0.1:8899/">&larr; Kembali ke website</a>
		</p>
	</div>
</div>

</body>
</html>
